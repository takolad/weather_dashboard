<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous">
    <!-- Our styling -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
    <container class="container-fluid">

        <header class="header row bg-dark fixed-top align-content-center">
            <div class="col-12 text-center text-light">
                <h1 class="mb-0">Weather Dashhboard</h1>
            </div>
        </header>

        <main class="row w-100 m-0 mt-3">
            <div class="col-md-4 mb-3 bg-light pb-3">
                <h4>Search for a City:</h4>
                <form class="d-flex mb-3 searchForm gap-2">
                    <input class="form-control" type="text" name="search">
                    <button class="btn btn-primary flex-grow-1" type="submit"><i class="fa fa-search"></i></button>
                </form>

                <div class="searchHistory">
                    <ul class="list-group historyList">
                    </ul>
                </div>
            </div>
            <div class="col-md-8 d-none" id="allWeather">
                <div class="border border-secondary rounded mb-3 p-3" id="currentWeather">
                    <h2 class="cityDate"><span class="weatherIcon"></span></h2>
                    <span class="temperature"></span>
                    <span class="humidity"></span>
                    <span class="wind"></span>
                    <span class="uvIndex"></span>
                </div>
                <div class="col-12">
                    <h2>5-Day Forecast:</h2>
                    <div class="d-flex flex-wrap gap-3">
                        <span class="day-card" id="dayOne"></span>
                        <span class="day-card" id="dayTwo"></span>
                        <span class="day-card" id="dayThree"></span>
                        <span class="day-card" id="dayFour"></span>
                        <span class="day-card" id="dayFive"></span>
                    </div>
                </div>
            </div>
        </main>




    </container>
    <script src="assets/js/script.js"></script>
</body>
</html>
